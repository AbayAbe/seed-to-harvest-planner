name: Deploy website ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Siapkan Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci --include=dev
      - name: Buat website statis
        run: npm run build:pages
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_CLINIC_API_URL: ${{ vars.NEXT_PUBLIC_CLINIC_API_URL }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Terbitkan website
        id: deployment
        uses: actions/deploy-pages@v4
